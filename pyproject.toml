[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shell-ast-sanitizer"
version = "0.1.0"
description = "Tokenizes shell commands to block chained exfiltration, subshell escapes, and destructive wildcards before execution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-shell-ast-sanitizer = "agent_shell_ast_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_shell_ast_sanitizer*"]
